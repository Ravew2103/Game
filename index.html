<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cidade Infinita</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <aside id="hud">
    <div class="brand">Cidade Infinita</div>

    <div class="row stats">
      <div><span class="label">Peças</span><strong id="placed">0</strong></div>
    </div>

    <div class="row controls">
      <label class="zoom">
        <span class="label">Zoom</span>
        <input id="zoom" type="range" min="0.6" max="6" step="0.05" value="2.2" />
      </label>
      <label class="toggle"><input id="gridchk" type="checkbox" checked /> Grade</label>
    </div>

    <div class="row"><button id="newcity">✦ Nova cidade</button></div>

    <details class="help">
      <summary>Como jogar</summary>
      <ul>
        <li><b>Toque</b> numa célula destacada e o jogo gera aquele pedaço da cidade</li>
        <li>O traçado continua <b>contínuo</b> entre as peças — ruas e rio fluem</li>
        <li>As células em volta aparecem como <b>esboço</b>: é só tocar para construir</li>
        <li><b>Arraste</b> para mover, <b>pinça</b>/slider para o zoom</li>
      </ul>
    </details>
  </aside>

  <script src="game.js"></script>
</body>
</html>
