<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cidade Infinita</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <aside id="hud">
    <div class="brand">Cidade Infinita</div>

    <div class="row main">
      <canvas id="current" width="150" height="150" class="preview"></canvas>
      <div class="btns">
        <button id="rotate">↻ Girar</button>
        <button id="skip" class="ghost">Descartar (<span id="skips">3</span>)</button>
        <div class="queue-wrap">
          <span class="label">Próximas</span>
          <div id="queue"></div>
        </div>
      </div>
    </div>

    <div class="row controls">
      <label class="zoom">
        <span class="label">Zoom</span>
        <input id="zoom" type="range" min="0.6" max="6" step="0.05" value="2.2" />
      </label>
      <label class="toggle"><input id="gridchk" type="checkbox" checked /> Grade</label>
    </div>

    <div class="row stats">
      <div><span class="label">Peças</span><strong id="placed">0</strong></div>
      <div><span class="label">Pontos</span><strong id="score">0</strong></div>
    </div>

    <details class="help">
      <summary>Como jogar</summary>
      <ul>
        <li><b>Toque / clique</b> em uma célula destacada para colocar a peça</li>
        <li><b>Arraste</b> (1 dedo) para mover o mapa</li>
        <li><b>Pinça</b> (2 dedos) ou <b>slider</b> para o zoom</li>
        <li><b>Girar</b> ajusta a peça antes de colocar</li>
      </ul>
    </details>
  </aside>

  <script src="game.js"></script>
</body>
</html>
